name: Cancellation settlement matrix
on:
  pull_request:
    branches: [fix/cancellation-finance-truthfulness-445]
    types: [opened, synchronize, reopened]
permissions:
  contents: read
jobs:
  finance:
    if: github.event.pull_request.head.repo.full_name == github.repository && github.head_ref == 'test/cancellation-settlement-matrix-445'
    runs-on: [self-hosted, macOS, ARM64]
    timeout-minutes: 15
    env:
      SUPABASE_ACCESS_TOKEN: ''
      SUPABASE_DB_PASSWORD: ''
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: npm ci
      - run: node scripts/test-booking-financial-integrity.mjs
