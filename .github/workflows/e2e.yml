name: E2E (staging)

on:
  # Manual only until the BABIN_STAGING_* and E2E_* secrets are set in GitHub.
  # Keep manual until dedicated staging credentials and runner policy are verified.
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: babin-staging-playwright
  cancel-in-progress: false

jobs:
  e2e:
    # Existing owner-authorized Mac CI lane; no paid hosted-runner fallback.
    runs-on: [self-hosted, macOS, ARM64]
    timeout-minutes: 45
    env:
      BABIN_STAGING_SUPABASE_URL: ${{ secrets.BABIN_STAGING_SUPABASE_URL }}
      BABIN_STAGING_ANON_KEY: ${{ secrets.BABIN_STAGING_ANON_KEY }}
      E2E_OWNER_EMAIL: ${{ secrets.E2E_OWNER_EMAIL }}
      E2E_OWNER_PASSWORD: ${{ secrets.E2E_OWNER_PASSWORD }}
      E2E_MANAGER_EMAIL: ${{ secrets.E2E_MANAGER_EMAIL }}
      E2E_MANAGER_PASSWORD: ${{ secrets.E2E_MANAGER_PASSWORD }}
      E2E_STAFF_EMAIL: ${{ secrets.E2E_STAFF_EMAIL }}
      E2E_STAFF_PASSWORD: ${{ secrets.E2E_STAFF_PASSWORD }}
      CI: 'true'
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: npm ci --ignore-scripts
      - run: node --test tests/e2e/staging-guard.test.mjs
      - run: npx playwright install chromium webkit
      - run: npx playwright test
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: playwright-mac-arm64
          path: |
            playwright-report/
            test-results/
          retention-days: 14
