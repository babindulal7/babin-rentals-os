name: Mobile browser (offline)
on:
  pull_request:
    branches: [main, integration/launch-repair-20261125, fix/mobile-dispatch-preview-20261125, fix/mobile-bookings-layout-20261125, fix/settings-responsive-navigation-20261126]
    paths:
      - 'src/**'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/mobile-browser-offline.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: mobile-browser-offline-${{ github.ref }}
  cancel-in-progress: true
jobs:
  browser:
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: [self-hosted, macOS, ARM64]
    timeout-minutes: 25
    env:
      CI: 'true'
      VITE_DATA_SOURCE: mock
      VITE_SUPABASE_URL: ''
      VITE_SUPABASE_ANON_KEY: ''
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: npm ci --ignore-scripts
      - run: npx playwright install chromium webkit
      - name: Mock browser responsive acceptance
        shell: bash
        run: |
          set -euo pipefail
          npm run dev:mock -- --host 127.0.0.1 --port 4189 --strictPort > "$RUNNER_TEMP/babin-mobile-vite.log" 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid" 2>/dev/null || true' EXIT
          for i in {1..60}; do
            if curl -fsS http://127.0.0.1:4189/ >/dev/null; then break; fi
            if ! kill -0 "$server_pid" 2>/dev/null; then cat "$RUNNER_TEMP/babin-mobile-vite.log"; exit 1; fi
            sleep 1
          done
          curl -fsS http://127.0.0.1:4189/ >/dev/null
          node --input-type=module <<'JS'
          import { chromium, webkit, expect } from '@playwright/test'
          const origin = 'http://127.0.0.1:4189'
          const cases = [[320, 700], [375, 812], [390, 844], [430, 932], [768, 1024], [1024, 768], [1440, 900]]
          const failures = []
          for (const [width, height] of cases) {
            const browser = await (width === 768 || width === 1024 ? webkit : chromium).launch()
            try {
              const context = await browser.newContext({ viewport: { width, height }, serviceWorkers: 'block', hasTouch: width < 1100, isMobile: width < 768 })
              await context.route('**/*', route => {
                const url = new URL(route.request().url())
                return url.origin === origin ? route.continue() : route.abort()
              })
              const page = await context.newPage()
              await page.goto(origin + '/login')
              await page.getByTitle('Sign in as Owner', { exact: true }).click({ timeout: 20000 })
              const welcome = page.getByRole('dialog', { name: 'Welcome to Babin Rentals OS' })
              await expect(welcome).toBeVisible({ timeout: 30000 })
              await welcome.getByRole('button', { name: 'Get Started', exact: true }).click()
              await expect(welcome).toBeHidden()
              await expect(page.locator('.dispatch-summaries')).toBeVisible({ timeout: 30000 })
              await expect(page.locator('.dispatch-summary')).toHaveCount(4)
              await expect(page.locator('.app-global-header__environment')).toHaveCount(0)
              const overflow = await page.evaluate(() => document.documentElement.scrollWidth - document.documentElement.clientWidth)
              if (overflow > 1) throw new Error('Horizontal overflow: ' + overflow + 'px')
              const create = page.getByRole('button', { name: 'Create new record', exact: true })
              await expect(create).toBeVisible()
              const rect = await create.boundingBox()
              if (!rect || rect.width < 43.5 || rect.height < 43.5) throw new Error('Create control below 44px target (0.5px rendering tolerance)')
              if (width < 768) {
                const tabs = page.locator('.dashboard-mobile-nav')
                await expect(tabs).toBeVisible()
                await tabs.getByText('Returns', { exact: true }).click()
                await expect(page.getByLabel('Date filter for returns', { exact: true })).toBeVisible()
                await tabs.getByText('Pickups', { exact: true }).click()
                await expect(page.getByLabel('Date filter for pickups', { exact: true })).toBeVisible()
                await expect(page.locator('.br-reference-inspector--phone')).toBeVisible()
              }
              // Test real booking navigation, filter multi-selection and card selection.
              await page.goto(origin + '/rentals')
              await expect(page.getByRole('heading', { name: 'Rentals', exact: true })).toBeVisible({ timeout: 30000 })
              const filter = page.getByRole('button', { name: /Show filters panel/ })
              await expect(filter).toBeVisible()
              await filter.click()
              const statusOptions = page.getByRole('checkbox', { name: /Filter by status:/ })
              await expect(statusOptions.first()).toBeVisible()
              const first = statusOptions.nth(0)
              const second = statusOptions.nth(1)
              // Controlled checkboxes commit through router navigation. Use the
              // normal user click and wait for each committed state before the
              // next interaction; do not force or skip a failing checkbox.
              if (!(await first.isChecked())) await first.click()
              await expect(first).toBeChecked()
              if (!(await second.isChecked())) await second.click()
              await expect(second).toBeChecked()
              await expect(first).toBeChecked()
              const tags = page.getByRole('checkbox', { name: /Filter by tag:/ })
              const tag = tags.first()
              await expect(tag).toBeVisible()
              if (!(await tag.isChecked())) await tag.click()
              await expect(tag).toBeChecked()
              await expect(first).toBeChecked()
              await expect(second).toBeChecked()
              await page.reload()
              await expect(filter).toBeVisible()
              if (!(await first.isVisible())) await filter.click()
              await expect(first).toBeChecked()
              await expect(second).toBeChecked()
              await expect(tag).toBeChecked()
              await first.click()
              await expect(first).not.toBeChecked()
              await expect(second).toBeChecked()
              await expect(tag).toBeChecked()
              console.log('PASS rental filters ' + width + 'x' + height)
              await page.goto(origin + '/settings')
              await expect(page.locator('.settings-v2')).toBeVisible({ timeout: 30000 })
              const categories = page.locator('.app-settings-mobile-row, .app-settings-tablet-tab, .app-settings-nav-item')
              await expect(categories.first()).toBeVisible()
              if (await categories.count() < 2) throw new Error('Missing settings categories')
              for (const category of await categories.all()) {
                const bounds = await category.boundingBox()
                if (!bounds || bounds.height < 43.5 || bounds.x < -1 || bounds.x + bounds.width > width + 1) throw new Error('Settings category clipped or below touch minimum')
              }
              const tabletNav = page.locator('.app-settings-tablet-tabs')
              if (await tabletNav.isVisible()) {
                const scroll = await tabletNav.evaluate(el => el.scrollWidth - el.clientWidth)
                if (scroll > 1) throw new Error('Settings categories require horizontal scrolling')
              }
              await categories.last().click()
              await expect(page.locator('.app-settings-pane')).toBeVisible()
              console.log('PASS settings navigation ' + width + 'x' + height)
              await page.goto(origin + '/inventory')
              const inventoryFilter = page.getByRole('button', { name: /Show filters panel/ })
              await expect(inventoryFilter).toBeVisible({ timeout: 30000 })
              if (width < 768) {
                const selectAll = page.getByRole('checkbox', { name: 'Select every model on this page', exact: true })
                await expect(selectAll).toBeVisible({ timeout: 30000 })
                const model = page.getByRole('checkbox', { name: /^Select model / }).first()
                await expect(model).toBeVisible()
                await model.click()
                await expect(model).toBeChecked()
                await model.click()
                await expect(model).not.toBeChecked()
              }
              console.log('PASS inventory navigation ' + width + 'x' + height)
              console.log('PASS ' + width + 'x' + height)
            } catch (error) {
              failures.push(width + 'x' + height + ': ' + String(error))
              console.error(failures.at(-1))
            } finally { await browser.close() }
          }
          if (failures.length) throw new Error(failures.join('\n'))
          JS
