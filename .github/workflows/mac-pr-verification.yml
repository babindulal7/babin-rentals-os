name: Windows PR smoke

# Legacy workflow filename retained to preserve the existing workflow history.
# Full PR CI is mandatory on Mac ARM64 in ci.yml; this complementary Windows
# job is intentionally light and is NOT a substitute for database/security,
# migration, lifecycle, financial-integrity, or coverage gates.
# One same-repository PR = one Windows smoke, without GitHub-hosted minutes.
on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

# A new head SHA replaces older checks for the same PR only.
# Do not cancel unrelated PRs or required automatic main CI.
concurrency:
  group: windows-pr-smoke-${{ github.event_name }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  windows-smoke:
    name: Windows · lint, safety guards, build
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: [self-hosted, Windows, X64]
    timeout-minutes: 90
    env:
      CI: 'true'
      VITE_DATA_SOURCE: mock
      NODE_OPTIONS: '--max-old-space-size=2048'

    steps:
      - name: Check out commit without persistent credentials
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Set up Node 24 and npm cache
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm

      - name: Confirm Windows x64 runner
        shell: pwsh
        run: |
          if ($env:RUNNER_OS -ne 'Windows' -or $env:RUNNER_ARCH -ne 'X64') {
            throw "Expected Windows/X64 self-hosted runner, got $env:RUNNER_OS/$env:RUNNER_ARCH"
          }
          Write-Output "Runner: $env:RUNNER_NAME ($env:RUNNER_OS/$env:RUNNER_ARCH)"

      - name: Install locked dependencies
        run: npm ci --no-audit --no-fund

      - name: Lint source
        run: npm run lint

      - name: Local API verification safety guards
        run: npm run test:local-api-guards

      # Build includes `tsc --noEmit`; do not re-run a separate typecheck.
      - name: Typecheck and build
        run: npm run build

      - name: Scope and runner evidence
        if: always()
        shell: pwsh
        run: |
          @(
            '### Windows PR smoke (lightweight)'
            "Runner: $env:RUNNER_NAME ($env:RUNNER_OS/$env:RUNNER_ARCH)"
            "Commit: $env:GITHUB_SHA"
            'Scope: locked install, lint, local API guards, TypeScript and Vite build.'
            'NOT full CI. Require the 17-gate Mac CI check on this exact PR head.'
          ) | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Append -Encoding utf8
